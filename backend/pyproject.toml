[project]
name = "skill-profiler-backend"
version = "0.1.0"
description = "Employee Skill Profiler Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "supabase>=2.4.0",
    "google-genai>=1.0.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]